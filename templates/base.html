{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Análisis Ejecutivos{% endblock %} · Fonda Argentina</title>
  <style>
    :root { --verde:#035953; --verde-oscuro:#023f3b; --crema:#f0e9d8; --texto:#2d2d2d; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color:var(--texto); background:#f6f4ee; }
    header { background:var(--verde-oscuro); color:var(--crema); padding:10px 28px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
    header .marca { display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:.02em; }
    header .marca img { height:34px; width:auto; }
    header nav { display:flex; align-items:center; gap:16px; font-size:14px; }
    header nav a { color:#fff; text-decoration:none; }
    header nav a:hover { text-decoration:underline; }
    main { max-width:980px; margin:28px auto; padding:0 20px; }
    h1 { color:var(--verde-oscuro); font-size:26px; margin:0 0 16px; }
    .card { background:#fff; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.08); padding:24px 28px; margin-bottom:18px; }
    .badge { display:inline-block; background:var(--crema); color:var(--verde-oscuro); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:5px 12px; border-radius:999px; }
    .btn { background:var(--verde); color:#fff; border:0; font-weight:600; font-size:14px; padding:9px 18px; border-radius:10px; cursor:pointer; text-decoration:none; }
    .btn:hover { background:#04746c; }
    .muted { color:#666; font-size:14px; line-height:1.5; }
  </style>
</head>
<body>
<header>
  <div class="marca">
    <img src="{% static 'ejecutivos/img/logo.png' %}" alt="Fonda Argentina">
    <span>Análisis Ejecutivos</span>
  </div>
  <nav>
    {% if user.is_authenticated %}
      <span>{{ user.get_full_name|default:user.username }}</span>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Administración</a>{% endif %}
      <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button class="btn">Salir</button></form>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
