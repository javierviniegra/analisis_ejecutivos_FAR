<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Análisis Ejecutivos{% endblock %} · Fonda Argentina</title>
  <style>
    :root { --verde:#10564E; }
    body { font-family: Georgia, "Times New Roman", serif; margin:0; color:#1a1a1a; background:#fafafa; }
    header { background:var(--verde); color:#fff; padding:14px 28px; display:flex; justify-content:space-between; align-items:center; }
    header a { color:#fff; margin-left:16px; }
    main { max-width:960px; margin:28px auto; padding:0 20px; }
    h1 { color:var(--verde); }
    .card { background:#fff; border:1px solid #ddd; border-radius:8px; padding:20px; margin-bottom:16px; }
    .btn { background:var(--verde); color:#fff; border:0; padding:9px 18px; border-radius:6px; cursor:pointer; }
    input[type=text], input[type=password] { padding:8px; width:100%; box-sizing:border-box; margin:4px 0 12px; }
    .err { color:#b00020; }
  </style>
</head>
<body>
<header>
  <strong>Fonda Argentina · Análisis Ejecutivos</strong>
  <nav>
    {% if user.is_authenticated %}
      {{ user.get_full_name|default:user.username }}
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Administración</a>{% endif %}
      <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button class="btn" style="margin-left:16px">Salir</button></form>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
